; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-super-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Target: ESP32-S3 "Super Mini" board (ESP32-S3FN4, no PSRAM)
; 400KB SRAM, 384KB ROM, 4MB flash - override the devkit's default 8MB/PSRAM assumptions
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi

; Super Mini only exposes native USB (no separate USB-UART bridge chip)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200

lib_deps = adafruit/Adafruit NeoPixel@^1.12.3
